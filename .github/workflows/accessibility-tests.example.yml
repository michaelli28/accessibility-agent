# Example workflow for running accessibility tests with the Accessibility Agent action
# Copy this file to your repository and customize as needed

name: Accessibility Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  accessibility-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Option 1: Run from this repository (if you're using at-agent directly)
      - name: Install dependencies
        run: npm ci

      - name: Run Accessibility Tests
        uses: ./.github/actions/accessibility-agent
        with:
          test-config: 'a11y-tests.json'
          provider: 'openai'
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          headless: 'true'
          continue-on-failure: 'true'
          # Optional: Dashboard integration for live tracking
          # dashboard-url: ${{ secrets.DASHBOARD_URL }}
          # dashboard-api-key: ${{ secrets.DASHBOARD_API_KEY }}

      # Option 2: Run from a remote repository (if at-agent is published)
      # - name: Run Accessibility Tests
      #   uses: your-org/at-agent/.github/actions/accessibility-agent@main
      #   with:
      #     test-config: 'a11y-tests.json'
      #     provider: 'openai'
      #     openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-results
          path: |
            accessibility-results.json
          retention-days: 30

      - name: Post results to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passedTests = '${{ steps.accessibility-test.outputs.passed-tests }}';
            const failedTests = '${{ steps.accessibility-test.outputs.failed-tests }}';
            const passRate = '${{ steps.accessibility-test.outputs.pass-rate }}';
            const dashboardUrl = '${{ steps.accessibility-test.outputs.dashboard-url }}';

            let body = `## Accessibility Test Results\n\n`;
            body += `| Metric | Value |\n`;
            body += `|--------|-------|\n`;
            body += `| Passed | ${passedTests} |\n`;
            body += `| Failed | ${failedTests} |\n`;
            body += `| Pass Rate | ${passRate}% |\n`;

            if (dashboardUrl) {
              body += `\n[View detailed results on dashboard](${dashboardUrl})`;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
