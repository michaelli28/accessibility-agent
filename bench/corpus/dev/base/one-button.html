<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Newsletter</title>
</head>
<body>
  <h1>Newsletter</h1>
  <p>One email a month, no more.</p>
  <button type="button" id="subscribe" data-bench-id="only-button">Subscribe</button>
  <p id="status" role="status"></p>
  <script>
    document.getElementById('subscribe').addEventListener('click', function () {
      document.getElementById('status').textContent = 'Subscribed';
    });
  </script>
</body>
</html>
