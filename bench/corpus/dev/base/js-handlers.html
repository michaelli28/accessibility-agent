<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Custom controls</title>
  <style>
    .custom-button { display: inline-block; padding: 6px 12px; border-radius: 4px; background: #0d6efd; color: #fff; cursor: pointer; }
    .custom-checkbox { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .custom-checkbox::before { content: ""; width: 14px; height: 14px; border: 2px solid #212529; border-radius: 2px; }
    .custom-checkbox[aria-checked="true"]::before { background: #212529; }
    :focus-visible { outline: 3px solid #fd7e14; outline-offset: 2px; }
  </style>
</head>
<body>
  <h1>Canvas tote bag</h1>
  <p>$24.00</p>
  <div class="custom-button" id="add-to-cart" role="button" tabindex="0" data-bench-id="custom-button">Add to cart</div>
  <div class="custom-checkbox" id="gift-wrap" role="checkbox" tabindex="0" aria-checked="false" data-bench-id="custom-checkbox">Gift wrap</div>
  <button type="button" id="checkout" data-bench-id="native-button">Checkout</button>
  <p id="status" role="status"></p>
  <script>
    (function () {
      var status = document.getElementById('status');
      var added = 0;
      function addToCart() {
        added += 1;
        status.textContent = 'Added to cart (' + added + ')';
      }
      var cart = document.getElementById('add-to-cart');
      cart.addEventListener('click', addToCart);
      cart.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          addToCart();
        }
      });

      var gift = document.getElementById('gift-wrap');
      function toggleGift() {
        gift.setAttribute('aria-checked', String(gift.getAttribute('aria-checked') !== 'true'));
      }
      gift.addEventListener('click', toggleGift);
      gift.addEventListener('keydown', function (e) {
        if (e.key === ' ') {
          e.preventDefault();
          toggleGift();
        }
      });

      document.getElementById('checkout').addEventListener('click', function () {
        status.textContent = 'Checkout started';
      });
    })();
  </script>
</body>
</html>
