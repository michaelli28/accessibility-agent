<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #F3F4F6;
            --bg-sidebar: #F9FAFB;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --accent-primary: #10B981;
            --accent-hover: #059669;
            --accent-light: rgba(16, 185, 129, 0.1);
            --border-light: #E5E7EB;
            --border-medium: #D1D5DB;
            --success: #10B981;
            --error: #EF4444;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 20px;
            --sidebar-width: 260px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: 'cv11', 'ss01';
            font-variation-settings: 'opsz' 20;
        }

        /* Layout */
        .app-layout {
            display: flex;
            height: 100vh;
        }

        /* Sidebar - ChatGPT-like functionality with light theme */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: width 0.2s ease;
            overflow: hidden;
        }

        .sidebar.collapsed {
            width: 0;
            border-right: none;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            gap: 8px;
        }

        .sidebar-toggle {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .sidebar-toggle:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .sidebar-toggle svg {
            width: 18px;
            height: 18px;
        }

        .new-chat-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
        }

        .new-chat-btn:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .new-chat-btn svg {
            width: 18px;
            height: 18px;
        }

        .sidebar-nav {
            padding: 0 12px 12px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .sidebar-nav-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .sidebar-nav-item svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* Search input */
        .search-container {
            padding: 0 12px;
        }

        .search-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            transition: all 0.15s;
        }

        .search-input-wrapper:focus-within {
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
        }

        .search-input-wrapper svg {
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            font-family: inherit;
            min-width: 0;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-clear {
            display: none;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0;
            border-radius: 50%;
            transition: all 0.15s;
        }

        .search-clear:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .search-clear svg {
            width: 12px;
            height: 12px;
        }

        .search-input:not(:placeholder-shown) + .search-clear {
            display: flex;
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 0 12px;
        }

        .sidebar-content::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-content::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 3px;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 12px 12px 8px;
        }

        .conversation-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .conversation-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
            position: relative;
        }

        .conversation-item:hover {
            background: var(--bg-tertiary);
        }

        .conversation-item.active {
            background: var(--accent-light);
        }

        .conversation-item-text {
            flex: 1;
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-item:hover .conversation-item-text {
            color: var(--text-primary);
        }

        .conversation-item.active .conversation-item-text {
            color: var(--accent-primary);
            font-weight: 500;
        }

        .conversation-actions {
            display: none;
            align-items: center;
            gap: 2px;
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(to right, transparent, var(--bg-tertiary) 30%);
            padding-left: 20px;
        }

        .conversation-item:hover .conversation-actions {
            display: flex;
        }

        .conversation-action-btn {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.15s;
        }

        .conversation-action-btn:hover {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .conversation-action-btn.delete:hover {
            color: var(--error);
        }

        .conversation-action-btn svg {
            width: 14px;
            height: 14px;
        }

        .sidebar-footer {
            padding: 12px;
            border-top: 1px solid var(--border-light);
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: background 0.15s;
        }

        .sidebar-user:hover {
            background: var(--bg-tertiary);
        }

        .sidebar-user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .sidebar-user-info {
            flex: 1;
            min-width: 0;
        }

        .sidebar-user-name {
            font-size: 14px;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-user-plan {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Floating toggle when sidebar is collapsed */
        .main-content .sidebar-toggle-float {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 100;
            width: 36px;
            height: 36px;
            display: none;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.15s;
        }

        .main-content .sidebar-toggle-float:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .main-content .sidebar-toggle-float svg {
            width: 18px;
            height: 18px;
        }

        .sidebar.collapsed ~ .main-content .sidebar-toggle-float {
            display: flex;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
        }

        /* Animated Grid Background */
        .grid-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .grid-background canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Header */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-light);
            z-index: 10;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .url-input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            transition: all 0.2s;
        }

        .url-input-wrapper:focus-within {
            background: var(--bg-secondary);
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .url-input-wrapper svg {
            width: 14px;
            height: 14px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .url-input-wrapper input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            font-family: inherit;
            color: var(--text-primary);
            width: 240px;
        }

        .url-input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        .provider-toggle {
            display: flex;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            overflow: hidden;
        }

        .provider-btn {
            padding: 8px 16px;
            border: none;
            background: transparent;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
        }

        .provider-btn:hover {
            background: rgba(0, 0, 0, 0.04);
        }

        .provider-btn.active {
            background: var(--accent-primary);
            color: white;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 3px;
        }

        /* Welcome */
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
        }

        .welcome-icon {
            width: 48px;
            height: 48px;
            background: var(--accent-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .welcome-icon svg {
            width: 24px;
            height: 24px;
            color: white;
        }

        .welcome-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.6;
        }

        /* Messages */
        .message {
            display: flex;
            gap: 12px;
            max-width: 800px;
            margin: 0 auto 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 500;
        }

        .message.user .message-avatar {
            background: var(--accent-primary);
            color: white;
        }

        .message.agent .message-avatar {
            background: var(--text-primary);
            color: white;
        }

        .message-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 600px;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user .message-bubble {
            background: var(--accent-primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.agent .message-bubble {
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-bottom-left-radius: 4px;
        }

        /* Thinking indicator */
        .agent-thinking {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            font-size: 13px;
            color: var(--text-secondary);
        }

        .thinking-dots {
            display: flex;
            gap: 4px;
        }

        .thinking-dots span {
            width: 6px;
            height: 6px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite;
        }

        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        /* Steps accordion */
        .steps-accordion {
            margin-top: 8px;
        }

        .steps-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            background: var(--bg-tertiary);
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s;
        }

        .steps-toggle:hover {
            background: var(--border-light);
        }

        .steps-toggle svg {
            width: 14px;
            height: 14px;
            transition: transform 0.2s;
        }

        .steps-toggle.expanded svg {
            transform: rotate(180deg);
        }

        .steps-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .steps-list.expanded {
            max-height: 400px;
            overflow-y: auto;
        }

        .steps-list-inner {
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .step-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-sm);
            font-size: 12px;
        }

        .step-num {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-primary);
            color: white;
            border-radius: 50%;
            font-size: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .step-info {
            flex: 1;
            min-width: 0;
        }

        .step-action {
            font-weight: 400;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .step-thought {
            color: var(--text-secondary);
            font-size: 11px;
            line-height: 1.4;
        }

        /* Result box */
        .result-box {
            margin-top: 8px;
            padding: 12px 16px;
            border-radius: var(--radius-md);
            font-size: 13px;
        }

        .result-box.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
        }

        .result-box.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .result-box.success .result-header { color: var(--success); }
        .result-box.error .result-header { color: var(--error); }

        .result-header svg {
            width: 16px;
            height: 16px;
        }

        .result-reason {
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* Input area */
        .input-area {
            padding: 16px 24px 24px;
            background: linear-gradient(to top, var(--bg-primary) 60%, transparent);
            z-index: 5;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-xl);
            padding: 6px 6px 6px 20px;
            box-shadow: var(--shadow-md);
            transition: all 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-light), var(--shadow-md);
        }

        .input-wrapper textarea {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-primary);
            resize: none;
            max-height: 120px;
            line-height: 1.5;
            padding: 8px 0;
        }

        .input-wrapper textarea::placeholder {
            color: var(--text-muted);
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .cancel-btn {
            padding: 8px 14px;
            border: 1px solid var(--border-light);
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s;
            display: none;
        }

        .cancel-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--border-medium);
        }

        .cancel-btn.visible {
            display: block;
        }

        .send-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: var(--accent-primary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: white;
            transition: background 0.15s;
        }

        .send-btn:hover {
            background: var(--accent-hover);
        }

        .send-btn:disabled {
            background: var(--border-medium);
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Browser Preview Panel */
        .browser-preview {
            width: 50%;
            min-width: 200px;
            max-width: 80%;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-light);
            display: none;
            flex-direction: row;
            flex-shrink: 0;
            position: relative;
        }

        .browser-preview.visible {
            display: flex;
        }

        .browser-preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-light);
            background: var(--bg-tertiary);
        }

        .browser-preview-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .browser-preview-title svg {
            width: 14px;
            height: 14px;
        }

        .browser-preview-url {
            flex: 1;
            margin: 0 12px;
            padding: 6px 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .browser-preview-close {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.15s;
        }

        .browser-preview-close:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .browser-preview-close svg {
            width: 14px;
            height: 14px;
        }

        .browser-preview-content {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #f5f5f5;
        }

        .browser-preview-content::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .browser-preview-content::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }

        .browser-preview-content::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 4px;
        }

        .browser-preview-content::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .browser-preview-content img {
            display: block;
            width: 100%;
            height: auto;
        }

        .browser-preview-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 13px;
            gap: 12px;
        }

        .browser-preview-placeholder svg {
            width: 32px;
            height: 32px;
            opacity: 0.5;
        }

        /* Resize Handle */
        .resize-handle {
            width: 6px;
            background: transparent;
            cursor: col-resize;
            flex-shrink: 0;
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 20;
        }

        .resize-handle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 40px;
            background: var(--border-medium);
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .resize-handle:hover::after,
        .resize-handle.dragging::after {
            opacity: 1;
        }

        .resize-handle:hover,
        .resize-handle.dragging {
            background: var(--accent-light);
        }

        /* Browser preview inner container */
        .browser-preview-inner {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
            margin-left: 6px;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .browser-preview {
                width: 45%;
            }
        }

        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                z-index: 50;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            }
            .sidebar.collapsed {
                width: 0;
            }
            .browser-preview {
                display: none !important;
            }
            .main-content .sidebar-toggle-float {
                display: flex;
            }
            .sidebar:not(.collapsed) ~ .main-content .sidebar-toggle-float {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .app-header {
                flex-wrap: wrap;
                gap: 12px;
            }
            .url-input-wrapper input {
                width: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <button class="sidebar-toggle" id="sidebarToggle" title="Close sidebar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                        <line x1="9" y1="3" x2="9" y2="21"/>
                    </svg>
                </button>
                <button class="new-chat-btn" id="newChatBtn" title="New chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 20h9"/>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                    </svg>
                </button>
            </div>
            <nav class="sidebar-nav">
                <div class="search-container" id="searchContainer">
                    <div class="search-input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                        <input type="text" class="search-input" id="searchInput" placeholder="Search chats...">
                        <button class="search-clear" id="searchClear" title="Clear search">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"/>
                                <line x1="6" y1="6" x2="18" y2="18"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </nav>
            <div class="sidebar-content">
                <div class="sidebar-section-title">Your chats</div>
                <div class="conversation-list" id="conversationList">
                    <!-- Conversations will be populated by JS -->
                </div>
            </div>
            <div class="sidebar-footer">
                <div class="sidebar-user">
                    <div class="sidebar-user-avatar">U</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name">User</div>
                        <div class="sidebar-user-plan">Free</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Floating Sidebar Toggle (shows when sidebar collapsed) -->
            <button class="sidebar-toggle-float" id="sidebarToggleFloat" title="Open sidebar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <line x1="9" y1="3" x2="9" y2="21"/>
                </svg>
            </button>

            <!-- Grid Background -->
            <div class="grid-background">
                <canvas id="gridCanvas"></canvas>
            </div>

            <!-- Header -->
            <header class="app-header">
                <div class="header-right">
                    <div class="url-input-wrapper">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="2" y1="12" x2="22" y2="12"/>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                        </svg>
                        <input type="url" id="urlInput" placeholder="Enter URL to browse...">
                    </div>
                    <div class="provider-toggle">
                        <button class="provider-btn active" data-provider="openai">OpenAI</button>
                        <button class="provider-btn" data-provider="gemini">Gemini</button>
                    </div>
                </div>
            </header>

            <!-- Chat Area -->
            <div class="chat-area">
                <div class="chat-container" id="chatContainer">
                    <div class="welcome-container" id="welcomeMessage">
                        <div class="welcome-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                            </svg>
                        </div>
                        <h1 class="welcome-title">Welcome to Accessibility Agent</h1>
                        <p class="welcome-subtitle">Enter a URL above and describe what you'd like the agent to accomplish. The agent will navigate and interact with the page to complete your goal.</p>
                    </div>
                </div>

                <!-- Input Area -->
                <div class="input-area">
                    <div class="input-wrapper">
                        <textarea id="messageInput" placeholder="Describe your goal..." rows="1"></textarea>
                        <div class="input-actions">
                            <button class="cancel-btn" id="cancelBtn">Cancel</button>
                            <button class="send-btn" id="sendBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M5 12h14M12 5l7 7-7 7"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Browser Preview Panel -->
        <aside class="browser-preview" id="browserPreview">
            <!-- Resize Handle -->
            <div class="resize-handle" id="resizeHandle"></div>
            <div class="browser-preview-inner">
            <div class="browser-preview-header">
                <span class="browser-preview-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                        <line x1="8" y1="21" x2="16" y2="21"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                    Live Preview
                </span>
                <span class="browser-preview-url" id="previewUrl">No page loaded</span>
                <button class="browser-preview-close" id="closePreview" title="Close preview">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>
            <div class="browser-preview-content" id="previewContent">
                <div class="browser-preview-placeholder">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                        <line x1="8" y1="21" x2="16" y2="21"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                    <span>Browser preview will appear here</span>
                </div>
            </div>
            </div>
        </aside>
    </div>

    <script src="client.js"></script>

    <!-- Grid Animation -->
    <script>
    (function() {
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');
        const gridBackground = document.querySelector('.grid-background');

        const gridSpacing = 50;
        const gravitationalStrength = 120;
        const gravitationalRadius = 200;
        const returnSpeed = 0.08;

        let mouse = { x: -1000, y: -1000 };
        let points = [];
        let canvasWidth = 0;
        let canvasHeight = 0;
        let cols = 0;
        let rows = 0;

        function resizeCanvas() {
            // Get the actual size of the grid background container
            const rect = gridBackground.getBoundingClientRect();
            canvasWidth = rect.width;
            canvasHeight = rect.height;

            // Set canvas size accounting for device pixel ratio
            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvasWidth * dpr;
            canvas.height = canvasHeight * dpr;

            // Scale context to match CSS pixels
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            initPoints();
        }

        function initPoints() {
            points = [];
            cols = Math.ceil(canvasWidth / gridSpacing) + 2;
            rows = Math.ceil(canvasHeight / gridSpacing) + 2;

            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    points.push({
                        originX: i * gridSpacing,
                        originY: j * gridSpacing,
                        x: i * gridSpacing,
                        y: j * gridSpacing,
                        vx: 0,
                        vy: 0
                    });
                }
            }
        }

        function updatePoints() {
            points.forEach(point => {
                const dx = mouse.x - point.x;
                const dy = mouse.y - point.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < gravitationalRadius && distance > 0) {
                    const force = (1 - distance / gravitationalRadius) * gravitationalStrength;
                    const angle = Math.atan2(dy, dx);
                    point.vx += Math.cos(angle) * force * 0.01;
                    point.vy += Math.sin(angle) * force * 0.01;
                }

                point.vx += (point.originX - point.x) * returnSpeed;
                point.vy += (point.originY - point.y) * returnSpeed;
                point.vx *= 0.9;
                point.vy *= 0.9;
                point.x += point.vx;
                point.y += point.vy;
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            // Draw lines
            ctx.strokeStyle = 'rgba(16, 185, 129, 0.08)';
            ctx.lineWidth = 1;

            // Horizontal
            for (let j = 0; j < rows; j++) {
                ctx.beginPath();
                for (let i = 0; i < cols; i++) {
                    const point = points[i * rows + j];
                    if (!point) continue;
                    i === 0 ? ctx.moveTo(point.x, point.y) : ctx.lineTo(point.x, point.y);
                }
                ctx.stroke();
            }

            // Vertical
            for (let i = 0; i < cols; i++) {
                ctx.beginPath();
                for (let j = 0; j < rows; j++) {
                    const point = points[i * rows + j];
                    if (!point) continue;
                    j === 0 ? ctx.moveTo(point.x, point.y) : ctx.lineTo(point.x, point.y);
                }
                ctx.stroke();
            }

            // Dots
            points.forEach(point => {
                const dist = Math.sqrt(Math.pow(mouse.x - point.x, 2) + Math.pow(mouse.y - point.y, 2));
                const intensity = dist < gravitationalRadius ? 1 - (dist / gravitationalRadius) : 0;
                ctx.beginPath();
                ctx.arc(point.x, point.y, 1.5 + intensity * 3, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(16, 185, 129, ${0.15 + intensity * 0.5})`;
                ctx.fill();
            });
        }

        function animate() {
            updatePoints();
            draw();
            requestAnimationFrame(animate);
        }

        // Track mouse on the main content area
        const mainContent = document.querySelector('.main-content');
        mainContent.addEventListener('mousemove', (e) => {
            const rect = gridBackground.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        mainContent.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        // Initial setup
        resizeCanvas();
        animate();

        // Handle resize
        window.addEventListener('resize', resizeCanvas);

        // Use ResizeObserver to detect when main-content changes size (e.g., preview panel opens)
        const resizeObserver = new ResizeObserver(() => {
            resizeCanvas();
        });
        resizeObserver.observe(gridBackground);
    })();
    </script>
</body>
</html>
